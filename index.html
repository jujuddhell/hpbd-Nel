<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09251d">
  <title>Стена поздравлений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-header">
    <p class="header-subtitle">A SPECIAL DAY FOR US</p>
    <h1>Стена Ананель Коваль</h1>
    <p class="header-description">
        понадобилось положить по кирпичику. Ладно, несколько кирпичиков. Имена этих людей нацарапаны на стене. Жми на царапульки, чтобы дотянуться и прочитать. Муа
    </p>
</header>

<main class="wall" aria-label="Изумрудная стена поздравлений">
    <div class="wall-vignette" aria-hidden="true"></div>
    <img class="wall-art" src="assets/stena_s_foto.jpg" alt="Изумрудная кирпичная стена с фотографией именинницы в оконной нише">

    <section class="guest-layer" id="guestLayer" aria-label="Поздравления от друзей">
      <!-- Имена и расположение создаются из массива в script.js -->
    </section>

    <footer class="wall-footer">
      <span>✦</span> И пусть к Январю будет дом! <span>✦</span>
    </footer>
  </main>

  <div class="modal-backdrop" id="greetingModal" aria-hidden="true">
    <article class="greeting-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-button" id="closeModal" type="button" aria-label="Закрыть">×</button>
      <p class="card-kicker">Кирпичик в твоей стене</p>
      <h2 id="modalTitle">Поздравление</h2>
      <div class="house-illustration" aria-hidden="true">
        <svg viewBox="0 0 320 190" role="img">
          <defs>
            <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#b9a16b"/><stop offset="1" stop-color="#75613f"/>
            </linearGradient>
            <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e6d9b9"/><stop offset="1" stop-color="#b9a982"/>
            </linearGradient>
          </defs>
          <path d="M47 86 L160 17 L273 86" fill="none" stroke="url(#roof)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M70 82 L70 169 L250 169 L250 82 Z" fill="url(#house)" stroke="#66563b" stroke-width="4"/>
          <path d="M137 169 V111 Q160 82 183 111 V169" fill="#314b3d" stroke="#66563b" stroke-width="4"/>
          <circle cx="174" cy="139" r="3" fill="#d9c58f"/>
          <rect x="88" y="103" width="35" height="35" rx="3" fill="#d7e2c7" stroke="#66563b" stroke-width="4"/>
          <path d="M105.5 103 V138 M88 120.5 H123" stroke="#66563b" stroke-width="3"/>
          <rect x="198" y="103" width="35" height="35" rx="3" fill="#d7e2c7" stroke="#66563b" stroke-width="4"/>
          <path d="M215.5 103 V138 M198 120.5 H233" stroke="#66563b" stroke-width="3"/>
          <path d="M82 149 Q105 138 129 149 M191 149 Q215 138 239 149" fill="none" stroke="#58704d" stroke-width="5" stroke-linecap="round"/>
          <path d="M42 171 Q160 160 278 171" fill="none" stroke="#a28d60" stroke-width="5" stroke-linecap="round"/>
          <g fill="#b7a06a"><circle cx="54" cy="151" r="5"/><circle cx="64" cy="143" r="4"/><circle cx="269" cy="151" r="5"/><circle cx="258" cy="143" r="4"/></g>
        </svg>

        <img
        id="customHouseImage"
        class="custom-house-image"
        src=""
        alt="Рисунок дома"
        >

      </div>
      <p class="greeting-text" id="greetingText"></p>
      <p class="signature" id="greetingSignature"></p>
      
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
